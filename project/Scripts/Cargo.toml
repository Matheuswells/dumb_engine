[package]
name = "game_scripts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dumb_core = { path = "../../crates/dumb_core" }
dumb_reflect = { path = "../../crates/dumb_reflect" }
dumb_ecs = { path = "../../crates/dumb_ecs" }
dumb_script = { path = "../../crates/dumb_script" }
log = "0.4"

# Same optimization settings as the engine so the editor and scripts agree.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# A standalone workspace: the scripts build on their own, in Scripts/target.
[workspace]
