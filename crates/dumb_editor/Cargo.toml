[package]
name = "dumb_editor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dumb-editor"
path = "src/main.rs"

[dependencies]
dumb_core.workspace = true
dumb_reflect.workspace = true
dumb_ecs.workspace = true
dumb_asset.workspace = true
dumb_render.workspace = true
dumb_script.workspace = true
dumb_runtime.workspace = true
dumb_physics.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
log.workspace = true
env_logger.workspace = true
ron.workspace = true
serde.workspace = true
rfd = "0.15"
# Code editor: live syntax check and the rust-analyzer (LSP) client.
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
# MCP server (AI agents drive the editor over localhost HTTP).
tiny_http = "0.12"
base64 = "0.22"
image.workspace = true
uuid.workspace = true
# Updater: download the latest GitHub release bundle and install it in place.
ureq = "3.4.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
tar = "0.4.46"
flate2 = "1.1.10"
semver = "1.0.28"
