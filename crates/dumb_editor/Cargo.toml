[package]
name = "dumb_editor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dumb-editor"
path = "src/main.rs"

[dependencies]
dumb_core.workspace = true
dumb_reflect.workspace = true
dumb_ecs.workspace = true
dumb_asset.workspace = true
dumb_render.workspace = true
dumb_script.workspace = true
dumb_runtime.workspace = true
dumb_physics.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
log.workspace = true
env_logger.workspace = true
ron.workspace = true
serde.workspace = true
rfd = "0.15"
# Code editor: live syntax check and the rust-analyzer (LSP) client.
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
