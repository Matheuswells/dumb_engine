# Tests every push and pull request: the full engine, and the headless server on a machine
# without GTK/WebKit, which proves it builds without the renderer, winit, egui or wry.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  full:
    name: Test (full engine)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --bin dumb-editor --bin dumb-player

  headless:
    name: Headless server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p dumb_runtime --no-default-features --bin dumb-server
      - name: Test
        run: cargo test -p dumb_runtime --no-default-features
      - name: Run the sample project for 60 ticks
        run: timeout 60 target/debug/dumb-server project --ticks 60
